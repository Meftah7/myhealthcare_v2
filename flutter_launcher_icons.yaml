# App launcher icons for myhealth.
#
# Canonical generator: `python tool/branding/generate_brand_assets.py`, which
# derives every platform icon (Android legacy + adaptive + splash +
# notification, iOS AppIcon + LaunchImage, web favicon/PWA/maskable, Windows
# .ico) from the approved master assets/branding/myhealth-logo-original.png.
# See assets/branding/README.md.
#
# This file is kept for anyone who prefers flutter_launcher_icons; it points
# at the same derived assets. Running it overwrites the generator's output
# with that tool's own processing, so prefer the script.
flutter_launcher_icons:
  image_path: "assets/branding/myhealth-icon-fullbleed.png"

  android: "ic_launcher"
  min_sdk_android: 21
  adaptive_icon_background: "#012D5E"
  adaptive_icon_foreground: "assets/branding/myhealth-symbol.png"

  ios: true
  remove_alpha_ios: true

  web:
    generate: false

  windows:
    generate: true
    image_path: "assets/branding/myhealth-logo.png"
    icon_size: 256
