name: Windows database acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-database:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Test real SQLite engine and persistence
        run: flutter test integration_test/drift_spike_test.dart --no-pub -d windows
