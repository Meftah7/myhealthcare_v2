# Build the Flutter web app, then deploy the compiled output to GitHub Pages
name: Deploy Flutter web app to Pages
on:
 push:
   branches: ["main"]
 workflow_dispatch:
permissions:
 contents: read
 pages: write
 id-token: write
concurrency:
 group: "pages"
 cancel-in-progress: false
jobs:
 build:
   runs-on: ubuntu-latest
   steps:
     - name: Checkout
       uses: actions/checkout@v4
     - name: Set up Flutter
       uses: subosito/flutter-action@v2
       with:
         flutter-version: '3.47.2'
         channel: 'stable'
     - name: Set up server runtime
       uses: actions/setup-node@v4
       with:
         node-version: '24.13.0'
     - name: Install dependencies
       run: flutter pub get
     - name: Generate code (Drift, etc.)
       run: dart run build_runner build --delete-conflicting-outputs
     - name: Validate pinned versions
       run: |
         flutter --version --machine > /tmp/flutter-version.json
         node -e "const p=require('./toolchain.json'),v=require('/tmp/flutter-version.json');if(v.frameworkVersion!==p.flutter||v.dartSdkVersion!==p.dart||process.versions.node!==p.node)throw Error('Toolchain mismatch')"
     - name: Check formatting
       run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
     - name: Analyze
       run: flutter analyze --no-fatal-infos
     - name: Test clinic workflows
       run: flutter test
     - name: Test shared server and verification
       run: node --test tools/serve_local.test.mjs services/shared_api/server.test.mjs services/shared_api/load.mjs services/document_verification/server.test.mjs
     - name: Build shared pilot
       run: flutter build web --release --no-web-resources-cdn --dart-define=SHARED_API_ORIGIN=http://localhost:8080
     - name: Build web release
       # base-href must match the repo name so asset paths resolve correctly
       # under https://<user>.github.io/<repo>/. --no-web-resources-cdn keeps
       # CanvasKit bundled locally instead of fetched from gstatic.com, which
       # the page's strict Content-Security-Policy (script-src 'self') blocks
       # — without this flag the app loads its JS but never renders (blank
       # white page, no catchable error since the CSP block happens before
       # any Dart code runs).
       run: flutter build web --release --base-href "/myhealthcare_v2/" --no-web-resources-cdn  --dart-define=APP_MODE=demo

     - name: Setup Pages
       uses: actions/configure-pages@v5
     - name: Upload artifact
       uses: actions/upload-pages-artifact@v3
       with:
         # Only the compiled web output, not the whole repo
         path: 'build/web'
 deploy:
   needs: build
   environment:
     name: github-pages
     url: ${{ steps.deployment.outputs.page_url }}
   runs-on: ubuntu-latest
   steps:
     - name: Deploy to GitHub Pages
       id: deployment
       uses: actions/deploy-pages@v5
