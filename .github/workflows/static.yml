# Build the Flutter web app, then deploy the compiled output to GitHub Pages
name: Deploy Flutter web app to Pages
on:
 push:
   branches: ["main"]
 workflow_dispatch:
permissions:
 contents: read
 pages: write
 id-token: write
concurrency:
 group: "pages"
 cancel-in-progress: false
jobs:
 build:
   runs-on: ubuntu-latest
   steps:
     - name: Checkout
       uses: actions/checkout@v4
     - name: Set up Flutter
       uses: subosito/flutter-action@v2
       with:
         flutter-version: '3.44.4'
         channel: 'stable'
     - name: Install dependencies
       run: flutter pub get
     - name: Generate code (Drift, etc.)
       run: dart run build_runner build --delete-conflicting-outputs
     - name: Build web release
       # base-href must match the repo name so asset paths resolve correctly
       # under https://<user>.github.io/<repo>/
       run: flutter build web --release --base-href "/myhealthcare_v2/"
     - name: Setup Pages
       uses: actions/configure-pages@v5
     - name: Upload artifact
       uses: actions/upload-pages-artifact@v3
       with:
         # Only the compiled web output, not the whole repo
         path: 'build/web'
 deploy:
   needs: build
   environment:
     name: github-pages
     url: ${{ steps.deployment.outputs.page_url }}
   runs-on: ubuntu-latest
   steps:
     - name: Deploy to GitHub Pages
       id: deployment
       uses: actions/deploy-pages@v5
